env:
  MIRROR_URL: git@github.com:EpitechPGEPromo2029/B-CPE-200-LIL-2-1-amazed-fabien.skotarek.git
  EXECUTABLES: "test"
#------------------------------------------------------------------------------------------------------------------------
#Header
name: Petit Pain

on:
  push:
    branches-ignore:
      - 'ga-ignore-*'
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'
run-name: Petit Pain 🍞

#------------------------------------------------------------------------------------------------------------------------
#Is good repo ?
jobs:
  Good-Repo:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/heads/ga-ignore-') && github.repository != 'git@github.com:EpitechPGEPromo2029/B-DOP-200-LIL-2-1-bschocolatine-lucas.lhomme.git' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

#------------------------------------------------------------------------------------------------------------------------
#Check the Coding Style
  check_coding_style:
    runs-on: ubuntu-latest
    needs: [Good-Repo]
    if: needs.Good-Repo.result == 'success'
    container: ghcr.io/epitech/coding-style-checker:latest
    steps:
      - name: Init Docker
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Coding Style Checker
        run: |
          check.sh $(pwd) $(pwd)
          cat coding-style-reports.log

      - name: Generate Annotations
        run: |
              log_file="coding-style-reports.log"
  
              grep -E '^(.*):(.*): (FATAL|MAJOR|MINOR|INFO):' "$log_file" | sort | uniq | while IFS= read -r line; do
                echo "Coding-Style"
                echo "::error:: $line"
              done
  
      - name: Coding Style Errors
        run: |
              if grep -qE ': (FATAL|MAJOR|MINOR|INFO):' "coding-style-reports.log"; then
                exit 1
              fi
  
  
#------------------------------------------------------------------------------------------------------------------------
  check_program_compilation:
    runs-on: ubuntu-latest
    needs: [check_coding_style]
    if: needs.check_coding_style.result == 'success'
    container: epitechcontent/epitest-docker
    steps:
      - name: Init Docker
        uses: actions/checkout@v4  # Récupère le code du repo GitHub
        with:
          fetch-depth: 1
      - name: Verify Make
        run: |
            make
            make clean

      - name: Programme is here?
        run: |
          if [ -f "${EXECUTABLES}" ]; then
            echo "::notice:: ${EXECUTABLES} is here!"
          else
            echo "::error:: ${EXECUTABLES} is missing!"
            exit 1
          fi

      - name: Running test
        run: |
            chmod +x ./tester.sh
            make tests_run
            
#------------------------------------------------------------------------------------------------------------------------
#Push the repo
  Push-Repo:
    runs-on: ubuntu-latest
    needs: [check_coding_style, check_program_compilation]
    if: needs.check_coding_style.result == 'success' && needs.check_program_compilation.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
